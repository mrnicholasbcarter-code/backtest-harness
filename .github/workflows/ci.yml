name: CI
on:
  push:
    branches: [main, master, develop]
  pull_request:
    branches: [main, master, develop]
jobs:
  test:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        python-version: ['3.10', '3.11', '3.12']
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
          cache: pip
      - name: Run tests
        run: |
          python -m pip install --upgrade pip
          python -m pip install -e ".[dev]"
          python -m pytest

  package:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
          cache: pip
      - name: Build and check package
        run: |
          python -m pip install --upgrade pip build twine
          python -m build
          python -m twine check dist/*
          python -m venv "$RUNNER_TEMP/verdict-backtest-wheel"
          "$RUNNER_TEMP/verdict-backtest-wheel/bin/python" -m pip install --upgrade pip
          "$RUNNER_TEMP/verdict-backtest-wheel/bin/python" -m pip install dist/*.whl
          "$RUNNER_TEMP/verdict-backtest-wheel/bin/python" -c "from backtest_harness import MonteCarloSimulator; assert MonteCarloSimulator"
          python -m venv "$RUNNER_TEMP/verdict-backtest-sdist"
          "$RUNNER_TEMP/verdict-backtest-sdist/bin/python" -m pip install --upgrade pip
          "$RUNNER_TEMP/verdict-backtest-sdist/bin/python" -m pip install dist/*.tar.gz
          "$RUNNER_TEMP/verdict-backtest-sdist/bin/python" -c "from backtest_harness import MonteCarloSimulator; assert MonteCarloSimulator"

  compat-gate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
          cache: pip
      - name: Install verdict-core (compat gate)
        run: |
          python -m pip install --upgrade pip
          # TEMPORARY: pinned to unmerged verdict-core PR #290 (feat/con-001-compat-gate, commit 7291941).
          # Move this pin to @main/a release tag once PR #290 merges.
          pip install "git+https://github.com/mrnicholasbcarter-code/verdict-core.git@7291941"
      - name: Check declared compat manifest
        run: verdict compat check --declared .verdict/compat-manifest.json --json
